# Only the USP lanes cross between the accounts: agents publish records
# on usp.v1.controller, the controller publishes requests on
# usp.v1.agent.<endpoint-id>. Telemetry does not cross. Herder builds
# telemetry inside its own account from the records agents send, so a
# telemetry.> publish from the device side could only forge a device's
# parameters.
#
# Passwords come from the container environment; NATS substitutes
# $VAR at startup. The system account is named Sys rather than $SYS
# because the parser substitutes $VAR and cannot escape the literal.
accounts {
  Sys {
    users = [{ user: sys, password: $NATS_SYS_PASSWORD }]
  }
  Herder {
    jetstream: enabled
    users   = [{ user: herder, password: $NATS_HERDER_PASSWORD }]
    imports = [
      { stream: { account: "Devices", subject: "usp.v1.controller" } }
      { stream: { account: "Devices", subject: "usp.v1.controller.>" } }
    ]
    exports = [
      { stream: "usp.v1.agent.>" }
    ]
  }
  Devices {
    jetstream: enabled
    # Agents are placed in this account by the auth callout, each under
    # the permissions of its own token. Nothing connects as this user, so
    # it is denied every subject. It stays because the callout's
    # auth_users names it.
    users = [
      {
        user: devices, password: $NATS_DEVICES_PASSWORD
        permissions: { publish: { deny: ">" }, subscribe: { deny: ">" } }
      }
    ]
    exports = [
      { stream: "usp.v1.controller" }
      { stream: "usp.v1.controller.>" }
    ]
    imports = [
      { stream: { account: "Herder", subject: "usp.v1.agent.>" } }
    ]
  }
  AuthCallout {
    users = [{ user: authservice, password: $NATS_AUTHSERVICE_PASSWORD }]
  }
}
system_account: Sys

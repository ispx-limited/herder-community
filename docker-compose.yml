# Herder Community Edition, single host. Secrets and key material are
# generated by up.sh on first run; see README.md.

networks:
  default:
    # DNAT instead of the userland proxy, so Herder sees a v6 CPE's own
    # address rather than the proxy's. The explicit ULA subnet keeps
    # network creation independent of the engine's address pools.
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.29.47.0/24
          gateway: 172.29.47.1
        - subnet: fd5e:7d2a:9c41::/64
          gateway: fd5e:7d2a:9c41::1

volumes:
  postgres_data:
  clickhouse_data:
  nats_data:
  redis_data:
  caddy_data:
  caddy_config:
  firmware:
  repos:

secrets:
  db_dsn:
    file: ./secrets/db_dsn

services:
  herder:
    image: ghcr.io/ispx-limited/herder${HERDER_IMAGE_SUFFIX?run ./up.sh, which sets it from HERDER_EDITION}:${HERDER_VERSION:?set HERDER_VERSION in .env}
    command: ["--roles=actions,api,compliance,cwmp,devicemanager,enrichment,eventhistory,firmware,geo,jobs,presence,provisioning,scores,sessionhistory,stun,taskworker,telemetry,usp,webhooks,xmpp"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      HEALTH_PORT: "9090"
      # The process health endpoint and the api role are separate
      # listeners and must not share a port.
      API_PORT: "8080"
      CWMP_PORT: "7547"
      # XMPP for TR-069 connection requests to CPEs behind NAT (extenders,
      # ATAs). The xmpp role serves ACS_HOST as its domain and the task
      # worker logs into it in-process as the ACS account. Plain text on
      # the loopback; a CPE on the access network connects on XMPP_PORT.
      # https://docs.herder.ispx.co/guides/cwmp/#connection-requests
      XMPP_DOMAINS: ${ACS_HOST:?}
      XMPP_ACS_PASSWORD: ${XMPP_ACS_PASSWORD:?}
      XMPP_SERVER: localhost
      XMPP_JID: acs@${ACS_HOST:?}
      XMPP_PASSWORD: ${XMPP_ACS_PASSWORD:?}
      XMPP_TLS_MODE: none
      # STUN for TR-069 connection requests to a CPE behind NAT without
      # XMPP (TR-069 Annex G). The stun role answers the CPE's keepalives
      # on STUN_PORT and sends the UDP connection request from the same
      # socket. Off on every device until a provisioning rule writes
      # STUNEnable. https://docs.herder.ispx.co/guides/cwmp/#the-stun-role
      STUN_LISTEN: ":3478"
      # The daily usage report to ispx. On by default; USAGE_REPORTING=off
      # in .env stops it. https://docs.herder.ispx.co/guides/usage-reporting/
      USAGE_REPORTING: ${USAGE_REPORTING:-on}
      # Where CPEs are told to run TR-143 and TR-471 throughput tests: a
      # diagd instance (github.com/ispx-limited/diagd).
      # Left empty, only profiles that name their own test_server can run
      # a speedtest, and Herder says so at start. The probe URL is read by
      # Herder itself, so it may be an address the container reaches
      # rather than the public name.
      DIAGNOSTICS_TEST_SERVER: ${DIAGNOSTICS_TEST_SERVER:-}
      DIAGNOSTICS_PROBE_SERVER: ${DIAGNOSTICS_PROBE_SERVER:-}
      DB_DSN_FILE: /run/secrets/db_dsn
      NATS_URL: nats://nats:4222
      # The streams Herder drains into Postgres and ClickHouse are held
      # in memory rather than written to disk a second time. A fresh
      # install creates them that way; an existing one keeps what it has
      # until they are moved (README, "Streams in memory").
      NATS_MEMORY_STREAMS: TELEMETRY,SESSION,DEVICE
      NATS_USER: herder
      NATS_PASSWORD: ${NATS_HERDER_PASSWORD:?}
      REDIS_ADDRESS: redis:6379
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: herder
      CLICKHOUSE_USER: herder
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      FIRMWARE_BLOB_ROOT: /var/lib/herder/firmware
      FIRMWARE_PORT: "7549"
      # What CPEs are told to fetch; ACS_HOST is the address they can
      # actually reach.
      FIRMWARE_BASE_URL: http://${ACS_HOST:?set ACS_HOST in .env}:${FIRMWARE_PORT:-7549}
      FIRMWARE_INTERNAL_URL: http://herder:7549
      FIRMWARE_SIGNING_KEY: ${FIRMWARE_SIGNING_KEY:?}
      ENCRYPTION_KEY_DIR: /etc/herder/keys
      CWMP_AUTH_ENABLED: "true"
      CWMP_AUTH_FACTORY_FILE: /etc/herder/cwmp-factory.yaml
      CWMP_AUTH_NONCE_KEY_FILE: /etc/herder/keys/cwmp-nonce
      CREDENTIAL_BOOTSTRAP_ENABLED: "true"
      USP_MQTT_DEVICE_SECRET: ${USP_MQTT_DEVICE_SECRET:?}
      USP_CONTROLLER_ID: self::herder
      GROUP_ASSIGNMENT_ENABLED: "true"
    volumes:
      - firmware:/var/lib/herder/firmware
      - repos:/data/repos
      - ./keys:/etc/herder/keys:ro
      - ./config/cwmp-factory.yaml:/etc/herder/cwmp-factory.yaml:ro
    secrets: [db_dsn]
    ports:
      - "${CWMP_PORT:-7547}:7547"
      - "${XMPP_PORT:-5222}:5222"
      - "${STUN_PORT:-3478}:3478/udp"
      - "${FIRMWARE_PORT:-7549}:7549"
      - "127.0.0.1:${HEALTH_PORT:-19090}:9090"
    healthcheck:
      # readyz, not healthz: every role has reported in, the CWMP
      # listener included.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  # The config role in its own process. It clones and validates the
  # operator YAML every other role reads, and a fatal error in a Go
  # process cannot be caught, so a fault there must not take the
  # protocol adapters down with it (issue #7). The other roles do not
  # wait for it: their config stores poll, and see an empty snapshot
  # until the first sync lands.
  configservice:
    image: ghcr.io/ispx-limited/herder${HERDER_IMAGE_SUFFIX?}:${HERDER_VERSION:?}
    command: ["--roles=config"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_SERVICE: configservice
      HEALTH_PORT: "9090"
      DB_DSN_FILE: /run/secrets/db_dsn
      NATS_URL: nats://nats:4222
      # The streams Herder drains into Postgres and ClickHouse are held
      # in memory rather than written to disk a second time. A fresh
      # install creates them that way; an existing one keeps what it has
      # until they are moved (README, "Streams in memory").
      NATS_MEMORY_STREAMS: TELEMETRY,SESSION,DEVICE
      NATS_USER: herder
      NATS_PASSWORD: ${NATS_HERDER_PASSWORD:?}
      REDIS_ADDRESS: redis:6379
      ENCRYPTION_KEY_DIR: /etc/herder/keys
    volumes:
      - repos:/data/repos
      - ./keys:/etc/herder/keys:ro
    secrets: [db_dsn]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  # The NATS auth callout is delivered inside the AuthCallout account,
  # so its responder connects as that account's user, in its own
  # container.
  authservice:
    image: ghcr.io/ispx-limited/herder${HERDER_IMAGE_SUFFIX?}:${HERDER_VERSION:?}
    command: ["--roles=auth"]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp]
    environment:
      LOG_LEVEL: info
      LOG_FORMAT: json
      LOG_SERVICE: authservice
      HEALTH_PORT: "9090"
      DB_DSN_FILE: /run/secrets/db_dsn
      REDIS_ADDRESS: redis:6379
      NATS_URL: nats://nats:4222
      NATS_USER: authservice
      NATS_PASSWORD: ${NATS_AUTHSERVICE_PASSWORD:?}
      AUTHSERVICE_NATSCALLOUT_ISSUER_KEY_FILE: /etc/certs/nkeys/issuer.seed
      ENCRYPTION_KEY_DIR: /etc/herder/keys
      ENCRYPTION_KEY_ID: default
      USP_MQTT_DEVICE_SECRET: ${USP_MQTT_DEVICE_SECRET:?}
    volumes:
      - ./keys:/etc/herder/keys:ro
      - ./nkeys:/etc/certs/nkeys:ro
    secrets: [db_dsn]

  herderapi:
    image: ghcr.io/ispx-limited/herder-api${HERDER_IMAGE_SUFFIX?}:${HERDER_VERSION:?}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      LOG_LEVEL: INFO
      # SQLAlchemy needs the driver in the URL, so this cannot reuse
      # the db_dsn secret the Go process reads verbatim.
      DATABASE_URL: postgresql+asyncpg://herder:${POSTGRES_PASSWORD:?}@pgbouncer:6432/herder
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: herder
      CLICKHOUSE_USER: herder
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      # The streams Herder drains into Postgres and ClickHouse are held
      # in memory rather than written to disk a second time. A fresh
      # install creates them that way; an existing one keeps what it has
      # until they are moved (README, "Streams in memory").
      NATS_MEMORY_STREAMS: TELEMETRY,SESSION,DEVICE
      NATS_USER: herder
      NATS_PASSWORD: ${NATS_HERDER_PASSWORD:?}
      ENCRYPTION_KEY_DIR: /etc/herder/keys
      ENCRYPTION_KEY_ID: default
      AUTH_ENABLED: "true"
      COOKIE_SECURE: "true"
      # The licence token, installed on start when newer than the one in
      # force. Empty in the Community Edition, which takes no licence.
      LICENSE_FILE: /etc/herder/license.txt
    volumes:
      - ./keys:/etc/herder/keys:ro
      - ./license.txt:/etc/herder/license.txt:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 90s

  frontend:
    image: ghcr.io/ispx-limited/herder-frontend${HERDER_IMAGE_SUFFIX?}:${HERDER_VERSION:?}
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      API_PROXY_TARGET: http://herderapi:8000
    depends_on:
      herderapi:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      HERDER_HOSTNAME: ${HERDER_HOSTNAME:-localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      herderapi:
        condition: service_healthy
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Runs once before up and before every upgrade:
  #   docker compose --profile migrate run --rm migrate
  # Targets postgres directly so goose never runs through transaction
  # pooling.
  migrate:
    image: ghcr.io/ispx-limited/herder-migrate${HERDER_IMAGE_SUFFIX?}:${HERDER_VERSION:?}
    profiles: [migrate]
    command: ["-allow-missing", "postgres", "postgres://herder:${POSTGRES_PASSWORD:?}@postgres:5432/herder?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      POSTGRES_USER: herder
      POSTGRES_DB: herder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    # Postgres's defaults assume a machine a tenth this size and a
    # checkpoint every five minutes, which rewrites the same busy pages
    # over and over. A quarter of the host's RAM is the usual starting
    # point for shared_buffers: set POSTGRES_SHARED_BUFFERS and
    # POSTGRES_EFFECTIVE_CACHE_SIZE in .env on a host larger than 4 GB.
    # The planner's page costs assume a spinning disk; these assume the
    # SSD or NVMe Herder should run on.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      - -c
      - checkpoint_timeout=30min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - max_wal_size=4GB
      - -c
      - wal_compression=lz4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "herder", "-d", "herder"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-p", "6432", "-U", "herder"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    environment:
      CLICKHOUSE_DB: herder
      CLICKHOUSE_USER: herder
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?}
      # Without this the default user is passwordless inside the
      # network.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      # 127.0.0.1 deliberately: localhost resolves to ::1 in this image
      # and ClickHouse only listens on IPv4.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["--config", "/etc/nats/nats.conf"]
    environment:
      NATS_SYS_PASSWORD: ${NATS_SYS_PASSWORD:?}
      NATS_HERDER_PASSWORD: ${NATS_HERDER_PASSWORD:?}
      NATS_DEVICES_PASSWORD: ${NATS_DEVICES_PASSWORD:?}
      NATS_AUTHSERVICE_PASSWORD: ${NATS_AUTHSERVICE_PASSWORD:?}
    volumes:
      - ./nats/nats.conf:/etc/nats/nats.conf:ro
      - ./nats/conf.d:/etc/nats/conf.d:ro
      - ./nkeys:/etc/nats/nkeys:ro
      - nats_data:/data
    ports:
      - "127.0.0.1:${NATS_MONITOR_PORT:-8222}:8222"
      # The device listener: USP CPEs connect here over MQTT.
      - "${MQTT_PORT:-1883}:1883"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
